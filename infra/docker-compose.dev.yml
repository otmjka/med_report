services:
  worker:
    build: ./worker
    container_name: medcontrol-worker
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: medcontrol-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: medcontrol
      RABBITMQ_DEFAULT_PASS: medcontrol
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  report-api:
    build: ../apps/report-api
    container_name: medcontrol-report-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      AMQP_URL: amqp://medcontrol:medcontrol@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
