services:
  postgres:
    image: postgres:16-alpine
    container_name: medcontrol-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medcontrol
      POSTGRES_PASSWORD: medcontrol
      POSTGRES_DB: medcontrol
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcontrol -d medcontrol"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: medcontrol-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: medcontrol
      RABBITMQ_DEFAULT_PASS: medcontrol
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  report-api:
    build: ../apps/report-api
    container_name: medcontrol-report-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      AMQP_URL: amqp://medcontrol:medcontrol@rabbitmq:5672
      DATABASE_URL: postgres://medcontrol:medcontrol@postgres:5432/medcontrol
      ARTIFACTS_DIR: /artifacts
    volumes:
      - artifacts:/artifacts:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  events-api:
    build: ../apps/events-api
    container_name: medcontrol-events-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      AMQP_URL: amqp://medcontrol:medcontrol@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  report-worker:
    build: ../apps/report-worker
    container_name: medcontrol-report-worker
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://medcontrol:medcontrol@rabbitmq:5672
      DATABASE_URL: postgres://medcontrol:medcontrol@postgres:5432/medcontrol
      ARTIFACTS_DIR: /artifacts
    volumes:
      - artifacts:/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  rabbitmq-data:
  postgres-data:
  artifacts:
